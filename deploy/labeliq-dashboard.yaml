# Label IQ Master Dashboard on shahi-server (https://labeliq.shahi-ai.in, behind Shahi SSO).
# Image: built on the server (podman) from this repo: localhost/labeliq-dashboard:latest. See README.md.
# The master token is NOT here: Secret `labeliq` (key LABELIQ_MASTER_TOKEN), created by hand on the server.
apiVersion: v1
kind: Namespace
metadata: {name: labeliq}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labeliq-dashboard
  namespace: labeliq
  labels: {app.kubernetes.io/name: labeliq-dashboard}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: labeliq-dashboard}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: labeliq-dashboard}
    spec:
      automountServiceAccountToken: false
      # labeliq.shahi.co.in is an internal name (office DNS only). The pod gets its address from here instead of
      # DNS. If IT moves the server to another address, change it here, in the NetworkPolicy below and in the
      # node route (README, "Network").
      hostAliases:
        - ip: "172.20.50.61"
          hostnames: ["labeliq.shahi.co.in"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proxy
          image: localhost/labeliq-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: TZ, value: "Asia/Kolkata"}
            - {name: LABELIQ_UPSTREAM_HOST, value: "labeliq.shahi.co.in"}
            - {name: LABELIQ_UPSTREAM_PORT, value: "443"}
            - {name: LABELIQ_CA_FILE, value: "/srv/certs/geotrust-tls-rsa-ca-g1.pem"}
            - {name: LABELIQ_CACHE_SECONDS, value: "5"}
            - name: LABELIQ_MASTER_TOKEN
              valueFrom: {secretKeyRef: {name: labeliq, key: LABELIQ_MASTER_TOKEN}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 300m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 10, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata:
  name: labeliq-dashboard
  namespace: labeliq
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: labeliq-dashboard}
  ports: [{port: 8000, targetPort: 8000}]
---
# Fence: only Traefik may call the pod, and the pod may call only the Label IQ server (172.20.50.61, HTTPS).
# No DNS, no internet, no other pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: labeliq-fence, namespace: labeliq}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{port: 8000, protocol: TCP}]
  egress:
    - to: [{ipBlock: {cidr: 172.20.50.61/32}}]
      ports: [{port: 443, protocol: TCP}]
